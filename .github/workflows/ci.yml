# =============================================================================
# OpenFinova Minab Banking — CI Build & Test
# =============================================================================
# Runs on every push to main / dev and on all pull requests.
# Steps: checkout → setup JDK → cache Maven deps → compile → test → upload reports
# =============================================================================

name: CI Build & Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Cancel in-progress runs for the same branch / PR to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw --batch-mode --no-transfer-progress verify -Djib.skip=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/target/surefire-reports/**'
          retention-days: 14

      - name: Upload application JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: banking-app
          path: banking-app/target/*.jar
          retention-days: 30
