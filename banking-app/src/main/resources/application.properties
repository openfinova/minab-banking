spring.application.name=openfinova-banking

# ==================== Identity / password policy ====================
# history-count: number of previous hashes to retain (1–48). revalidate-on-login: weak legacy passwords
# trigger force_password_change on form login (plaintext checked once per login).
identity.password.history-count=12
identity.password.revalidate-on-login=true

# Account lifecycle: provisioning approval gate, account-expiry warning job (Spring @Scheduled).
# identity.lifecycle.require-provisioning-approval=false
# identity.lifecycle.expiry-warning-lead-days=14
# identity.lifecycle.expiry-notification-cron=0 0 7 * * *
# identity.lifecycle.expiry-notifications-enabled=true

# ==================== Identity / KYC at token issuance ====================
# Customer logins (UserType=CUSTOMER) must have customer_party_id and VERIFIED KYC in the customer module.
# Set to false only for isolated identity deployments without customer-service on the classpath.
identity.kyc.require-verified-for-customers=true

# MFA TOTP seed encryption at rest (AES-256-GCM). Key is SHA-256-hashed to derive the AES key.
# TODO: Replace with a secret sourced from Vault/KMS (or env-only injection); do not use a default in production.
identity.mfa-secret.encryption.key=dev-only-replace-with-long-random-secret

# Role assignment: privileged role may assign any role; others only roles at/below them in hierarchy
# (see BankingRole.parentRole, DataInitializer.applyRoleHierarchy). SoD pairs cannot be combined.
# identity.rbac.privileged-assigner-role-name=ADMIN
# identity.rbac.customer-portal-role-name=CUSTOMER
# identity.rbac.sod-conflicting-role-pairs=LOAN_OFFICER|LOAN_SUPERVISOR,GL_ACCOUNTANT|GL_MANAGER

# Stateless OAuth2 token policy (replaces servlet session timeouts for REST APIs).
# max-active-authorizations-per-user: cap simultaneous logins per user per OAuth2 client; 0 = unlimited.
identity.oauth2.access-token-ttl-minutes=60
identity.oauth2.refresh-token-ttl-days=7
identity.oauth2.reuse-refresh-tokens=false
identity.oauth2.max-active-authorizations-per-user=0
identity.oauth2.include-client-ip-claim=true

# Form login: max POST /login per IP per rolling minute (complements per-account lockout).
banking.identity.login-rate-limit.enabled=true
banking.identity.login-rate-limit.max-attempts-per-ip-per-minute=40

# ==================== OAuth2 / Authorization Server Configuration ====================
# Issuer URI — must match the value the Auth Server includes in tokens.
# The resource server uses this URI to auto-discover the JWK endpoint.
spring.security.oauth2.authorizationserver.issuer=http://localhost:8080
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080
# ==================== H2 Database Configuration ====================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 console for testing and debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==================== JPA/Hibernate Configuration ====================
# Database platform dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# DDL auto strategy: create-drop recreates schema on each startup (suitable for in-memory databases)
spring.jpa.hibernate.ddl-auto=create-drop

# Run Bean Validation constraints on JPA entities at persist/update (not only on @RestController @Valid DTOs).
spring.jpa.properties.jakarta.persistence.validation.mode=AUTO

# Show SQL statements in logs (set to true for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging configuration
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.use_sql_comments=true

# ==================== Application Configuration ====================
app.base-currency=EUR

# Customer anonymization: HMAC-SHA256 secret for tax ID pseudonymization.
# Override in production with a secure value (e.g. from Key Vault).
customer.anonymization.hmac-secret=dev-default-change-in-production

# ==================== Business Hours Configuration ====================
# Hours in 24h notation (inclusive start, exclusive end).
# Override per deployment profile for 24/7 channels or different time zones.
banking.datetime.business-hours.start=9
banking.datetime.business-hours.end=17

# ==================== Error Handling ====================
# GlobalExceptionHandler produces RFC 7807 ProblemDetail responses for all known exceptions.
# These settings ensure the fallback Whitelabel error page also exposes nothing sensitive.
spring.mvc.problemdetails.enabled=true
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false

# ==================== OpenAPI / Swagger UI ====================
# OAuth2 client for "Authorize" in Swagger UI (matches dev client in AuthorizationServerConfig).
springdoc.swagger-ui.oauth.client-id=staff-app
springdoc.swagger-ui.oauth.client-secret=staff-secret
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=openid,profile,banking.staff
springdoc.swagger-ui.oauth.use-basic-authentication-with-access-code-grant=true
