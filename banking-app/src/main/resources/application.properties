spring.application.name=openfinova-banking

# Allow long query strings (e.g. GET /connect/logout?id_token_hint=...) when id_token claims are large.
# The default ~8KB limit can return 400 from Tomcat before Spring processes OIDC logout.
server.max-http-request-header-size=128KB

# ==================== Default Active Profile ====================
# Defaults to 'local' for development. Override via CLI, env var, or deployment config.
spring.profiles.active=local

# ==================== Identity / password policy ====================
# history-count: number of previous hashes to retain (1–48). revalidate-on-login: weak legacy passwords
# trigger force_password_change on form login (plaintext checked once per login).
identity.password.history-count=12
identity.password.revalidate-on-login=true

# Account lifecycle: provisioning approval gate, account-expiry warning job (Spring @Scheduled).
# identity.lifecycle.require-provisioning-approval=false
# identity.lifecycle.expiry-warning-lead-days=14
# identity.lifecycle.expiry-notification-cron=0 0 7 * * *
# identity.lifecycle.expiry-notifications-enabled=true

# ==================== Identity / KYC at token issuance ====================
# Customer logins (UserType=CUSTOMER) must have customer_party_id and VERIFIED KYC in the customer module.
# Set to false only for isolated identity deployments without customer-service on the classpath.
identity.kyc.require-verified-for-customers=true

# Role assignment: privileged role may assign any role; others only roles at/below them in hierarchy
# (see BankingRole.parentRole, DataInitializer.applyRoleHierarchy). SoD pairs cannot be combined.
# identity.rbac.privileged-assigner-role-name=ADMIN
# identity.rbac.customer-portal-role-name=CUSTOMER
# identity.rbac.sod-conflicting-role-pairs=LOAN_OFFICER|LOAN_SUPERVISOR,GL_ACCOUNTANT|GL_MANAGER

# Per-client OAuth2 token policy (see docs/security/oauth-session-policy.md).
identity.oauth2.include-client-ip-claim=true
# staff-portal: Next.js BFF — short access, no refresh grant, tight concurrent cap
identity.oauth2.clients.staff-portal.access-token-ttl-minutes=10
identity.oauth2.clients.staff-portal.refresh-token-ttl-minutes=0
identity.oauth2.clients.staff-portal.max-active-authorizations-per-user=2
# customer-portal: Next.js BFF — refresh with rotation, bounded absolute refresh lifetime
identity.oauth2.clients.customer-portal.access-token-ttl-minutes=15
identity.oauth2.clients.customer-portal.refresh-token-ttl-minutes=30
identity.oauth2.clients.customer-portal.reuse-refresh-tokens=false
identity.oauth2.clients.customer-portal.max-active-authorizations-per-user=5
# staff-app: Swagger / local API exploration only (not for production portals)
identity.oauth2.clients.staff-app.access-token-ttl-minutes=60
identity.oauth2.clients.staff-app.refresh-token-ttl-minutes=10080
identity.oauth2.clients.staff-app.reuse-refresh-tokens=false
identity.oauth2.clients.staff-app.max-active-authorizations-per-user=0
# mobile-app: reserved — see docs/security/oauth-session-policy.md (not registered in dev)
# identity.oauth2.clients.mobile-app.access-token-ttl-minutes=15
# identity.oauth2.clients.mobile-app.refresh-token-ttl-minutes=480
# identity.oauth2.clients.mobile-app.reuse-refresh-tokens=false

# Form login: max POST /login per IP per rolling minute (complements per-account lockout).
banking.identity.login-rate-limit.enabled=true
banking.identity.login-rate-limit.max-attempts-per-ip-per-minute=40

# ==================== Application Configuration ====================
app.base-currency=EUR

# ==================== Exchange Rate Sync ====================
# Pulls daily mid rates from the configured provider (currently only 'ecb' is implemented:
# https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml — EUR-base, business days, ~16:00 CET).
# On startup the data initializer seeds today's rates if the table is empty for the base currency;
# the @Scheduled job then keeps things fresh. Set sync.enabled=false to disable both.
# max-staleness-days: when an exact-date lookup misses, fall back to the most recent prior rate within
# this window (covers weekends, holidays, and provider hiccups). 0 disables the fallback.
app.exchange-rate.provider=ecb
app.exchange-rate.sync.enabled=true
app.exchange-rate.sync.cron=0 30 16 * * MON-FRI
app.exchange-rate.sync.zone=Europe/Brussels
app.exchange-rate.max-staleness-days=7

# ==================== Business Hours Configuration ====================
# Hours in 24h notation (inclusive start, exclusive end).
# Override per deployment profile for 24/7 channels or different time zones.
banking.datetime.business-hours.start=9
banking.datetime.business-hours.end=17

# ==================== Error Handling ====================
# GlobalExceptionHandler produces RFC 7807 ProblemDetail responses for all known exceptions.
# These settings ensure the fallback Whitelabel error page also exposes nothing sensitive.
spring.mvc.problemdetails.enabled=true
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false

# ==================== JPA / Bean Validation ====================
# Run Bean Validation constraints on JPA entities at persist/update (not only on @RestController @Valid DTOs).
spring.jpa.properties.jakarta.persistence.validation.mode=AUTO

# ==================== Database migrations ====================
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
