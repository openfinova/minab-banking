# ==========================================================================
# Profile: prod
# PostgreSQL database. Schema is validated only; DDL is owned by Liquibase.
# Credentials are injected via environment variables.
# ==========================================================================

# ==================== PostgreSQL Database Configuration ====================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable H2 console
spring.h2.console.enabled=false

# ==================== JPA / Hibernate ====================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.use_sql_comments=false

# ==================== Liquibase ====================
spring.liquibase.contexts=prod

# ==================== OAuth2 / Authorization Server ====================
spring.security.oauth2.authorizationserver.issuer=${OAUTH2_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI}

# ==================== Secrets ====================
identity.mfa-secret.encryption.key=${MFA_ENCRYPTION_KEY}
customer.anonymization.hmac-secret=${CUSTOMER_HMAC_SECRET}

# ==================== OpenAPI / Swagger UI ====================
# Disable Swagger UI in production for security.
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ==================== Logging ====================
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.security=WARN
