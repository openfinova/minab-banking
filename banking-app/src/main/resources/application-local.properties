# ==========================================================================
# Profile: local
# Local PostgreSQL (e.g. docker compose postgres). Overrides DB_URL in compose for JDBC to host "postgres".
# ==========================================================================

# ==================== PostgreSQL Database Configuration ====================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/openfinova_local}
spring.datasource.username=${DB_USERNAME:openfinova}
spring.datasource.password=${DB_PASSWORD:openfinova}
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable H2 console
spring.h2.console.enabled=false

# ==================== JPA / Hibernate ====================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.use_sql_comments=false

# ==================== Liquibase ====================
spring.liquibase.contexts=local

# ==================== OAuth2 / Authorization Server ====================
spring.security.oauth2.authorizationserver.issuer=${OAUTH2_ISSUER_URI:http://localhost:8080}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8080}

# ==================== Secrets (local defaults) ====================
identity.mfa-secret.encryption.key=${MFA_ENCRYPTION_KEY:local-dev-encryption-key-change-me}
customer.anonymization.hmac-secret=${CUSTOMER_HMAC_SECRET:local-dev-hmac-secret-change-me}

# ==================== OpenAPI / Swagger UI ====================
# OAuth2 client for "Authorize" in Swagger UI (matches dev client in AuthorizationServerConfig).
springdoc.swagger-ui.oauth.client-id=staff-app
springdoc.swagger-ui.oauth.client-secret=staff-secret
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=openid,profile,email,banking.staff

# Align IdP form-login / MFA servlet session with staff portal idle expectations
server.servlet.session.timeout=10m
springdoc.swagger-ui.oauth.use-basic-authentication-with-access-code-grant=true
