<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="color-scheme" content="dark"/>
  <title>Verify sign-in — OpenFinova Banking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/auth-portal.css}"/>
</head>
<body class="auth-portal">
  <div class="auth-portal__bg" aria-hidden="true"></div>
  <div class="auth-portal__grid" aria-hidden="true"></div>
  <div class="auth-portal__wrap">
    <main class="auth-card auth-card--narrow" role="main">
      <header class="auth-brand">
        <div class="auth-brand__mark" aria-hidden="true">OF</div>
        <div class="auth-brand__text">
          <span class="auth-brand__title">OpenFinova</span>
          <span class="auth-brand__sub">Banking platform</span>
        </div>
      </header>
      <h1 class="auth-heading">Second factor</h1>
      <p class="auth-desc">Enter the 6-digit code from your authenticator app, or an 8-digit recovery code.</p>

      <div th:if="${param.error}" class="auth-alert" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        <span>That code could not be verified. Try again.</span>
      </div>

      <form class="auth-form" th:action="@{/mfa/verify}" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="auth-field">
          <label for="code">Authenticator or recovery code</label>
          <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" required autofocus
                 placeholder="6-digit TOTP or 8-digit recovery" maxlength="8" pattern="[0-9]{6,8}"/>
        </div>
        <button class="auth-submit" type="submit">Continue</button>
      </form>

      <p class="auth-footnote">If you lost your device, use a recovery code you saved at enrollment.</p>
    </main>
  </div>
</body>
</html>
