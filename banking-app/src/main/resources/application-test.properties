# ==========================================================================
# Profile: test
# In-memory H2 database for automated tests. Schema is created and dropped
# per application context lifecycle.
# ==========================================================================

# ==================== H2 Database Configuration ====================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable H2 console during tests
spring.h2.console.enabled=false

# ==================== JPA / Hibernate ====================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.use_sql_comments=false

# ==================== OAuth2 / Authorization Server ====================
spring.security.oauth2.authorizationserver.issuer=http://localhost:8080
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080

# ==================== Secrets (test-only values) ====================
identity.mfa-secret.encryption.key=test-only-encryption-key-do-not-use
customer.anonymization.hmac-secret=test-only-hmac-secret-do-not-use

# ==================== Logging ====================
# Keep test output clean
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
