# ==========================================================================
# Profile: test — PostgreSQL via Testcontainers (Docker required for mvn test).
# Matches production dialect; Liquibase applies the same changelog as runtime.
# ==========================================================================

spring.datasource.url=jdbc:tc:postgresql:16-alpine:///testdb
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test

spring.h2.console.enabled=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.use_sql_comments=false

spring.liquibase.enabled=true
spring.liquibase.contexts=test

spring.security.oauth2.authorizationserver.issuer=http://localhost:8080
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080
banking.oauth2.issuer=http://localhost:8080
banking.oauth2.jwk-set-uri=http://localhost:8081/realms/openfinova/protocol/openid-connect/certs

identity.mfa-secret.encryption.key=test-only-encryption-key-do-not-use
customer.anonymization.hmac-secret=test-only-hmac-secret-do-not-use
tan.secret.encryption.key=test-only-tan-encryption-key-do-not-use
tan.qr.signing.key=test-only-tan-qr-signing-key-do-not-use

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
